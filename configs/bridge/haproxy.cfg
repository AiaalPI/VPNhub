# MOW2 IPv4 entry -> HEL1 IPv6. TCP pass-through: no TLS keys or client UUIDs.
global
    maxconn 2048
    user haproxy
    group haproxy

defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout check 3s

frontend reality
    bind 89.125.136.14:443
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend hel1_subscriptions if { req.ssl_sni -i sub.kynnet.space }
    default_backend hel1_reality

backend hel1_reality
    # HEL1's public frontend supplies the PROXY header to native Xray.
    server hel1 [2605:e440:7::1:1a8]:443 check inter 10s fall 3 rise 2

frontend xhttp
    bind 89.125.136.14:2087
    default_backend hel1_xhttp

backend hel1_xhttp
    server hel1 [2605:e440:7::1:1a8]:2087 check inter 10s fall 3 rise 2

# Existing Happ URLs keep their :8443 port and certificate chain unchanged.
frontend subscriptions_legacy
    bind 89.125.136.14:8443
    default_backend hel1_subscriptions

backend hel1_subscriptions
    server hel1 [2605:e440:7::1:1a8]:8443 check inter 10s fall 3 rise 2

frontend acme_http
    bind 89.125.136.14:80
    default_backend hel1_acme

backend hel1_acme
    server hel1 [2605:e440:7::1:1a8]:80 check inter 10s fall 3 rise 2

# Temporary MOW2 -> HEL1 IPv6 test. No TLS termination or client secrets.
# Deliberately uses alternate ports; do not publish this as the production entry.
global
    maxconn 1024
    user haproxy
    group haproxy

defaults
    mode tcp
    timeout connect 5s
    timeout client 5m
    timeout server 5m
    timeout check 3s

frontend reality_test
    bind 89.125.136.14:24443
    default_backend hel1_reality

backend hel1_reality
    # Public HEL1 frontend adds the PROXY header expected by native Xray.
    server hel1 [2605:e440:7::1:1a8]:443 check inter 10s fall 3 rise 2

frontend xhttp_test
    bind 89.125.136.14:22087
    default_backend hel1_xhttp

backend hel1_xhttp
    server hel1 [2605:e440:7::1:1a8]:2087 check inter 10s fall 3 rise 2

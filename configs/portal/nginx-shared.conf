# Production host-network ingress. Xray keeps port 443 on loopback.
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 8192; }
stream {
    map $ssl_preread_server_name $target {
        kynnet.space 127.0.0.1:9443;
        default 127.0.0.1:443;
    }
    server {
        listen 89.125.145.65:443;
        listen [2605:e440:e::3a7]:443;
        ssl_preread on;
        proxy_pass $target;
        proxy_protocol on;
        proxy_connect_timeout 5s;
        proxy_timeout 24h;
    }
}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log off;
    client_max_body_size 16k;
    server {
        listen 80;
        server_name kynnet.space;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location / { return 308 https://kynnet.space$request_uri; }
    }
    server {
        listen 127.0.0.1:9443 ssl proxy_protocol;
        server_name kynnet.space;
        ssl_certificate /etc/letsencrypt/live/kynnet.space/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/kynnet.space/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
        add_header Strict-Transport-Security "max-age=31536000" always;
        location = / { return 302 /web/; }
        location = /web { return 308 /web/; }
        location /web/ {
            proxy_pass http://127.0.0.1:8888;
            proxy_set_header Host kynnet.space;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 5s;
            proxy_read_timeout 45s;
        }
        location / { return 404; }
    }
}

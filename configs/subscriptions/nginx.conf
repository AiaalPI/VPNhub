server {
    listen 8443 ssl http2;
    server_name sub.kynnet.space;

    ssl_certificate /etc/letsencrypt/live/sub.kynnet.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sub.kynnet.space/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    server_tokens off;

    location = /healthz {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://vpn_hub_bot:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /subscriptions/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass http://vpn_hub_bot:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /payments/wata/webhook {
        limit_except POST {
            deny all;
        }
        proxy_pass http://vpn_hub_bot:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /payments/yoomoney/webhook {
        limit_except POST {
            deny all;
        }
        proxy_pass http://vpn_hub_bot:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /payment/yoomoney {
        limit_except POST {
            deny all;
        }
        proxy_pass http://vpn_hub_bot:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /api/v1/payment/yoomoney {
        limit_except POST {
            deny all;
        }
        proxy_pass http://vpn_hub_bot:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location / {
        return 404;
    }
}

name: Activate MOW2 VPN exports

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Export the MOW2 address or restore panel-derived addresses
        required: true
        default: enable
        type: choice
        options:
          - enable
          - disable

permissions:
  contents: read

concurrency:
  group: vpnhub-origin-production
  cancel-in-progress: false

jobs:
  activate:
    if: github.ref == 'refs/heads/main'
    environment: bridge-production
    runs-on: ubuntu-latest
    steps:
      - name: Activate reviewed public address through canonical deployment
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPORT_MODE: ${{ inputs.mode }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXPORT_MODE
          script: |
            set -eu
            cd /opt/vpnhub
            test "$(git branch --show-current)" = main
            test -z "$(git status --porcelain)"
            git fetch origin main
            git merge --ff-only origin/main
            bash /opt/vpnhub/deploy.sh subscriptions-origin "$EXPORT_MODE"
